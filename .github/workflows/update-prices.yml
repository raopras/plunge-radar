name: Update Agile prices

# Octopus publishes tomorrow's Agile prices at around 4pm UK time (sometimes later).
# GitHub schedules run in UTC, so we check every hour from 15:07 to 22:07 UTC, which
# covers 4pm onwards in both summer and winter. Once tomorrow is stored, later runs
# exit in seconds without calling the API. The 00:07 run is a daily heartbeat.
on:
  schedule:
    # GitHub runs scheduled jobs late or skips them when it's busy, so we ask often:
    # every 15 minutes from 15:00 to 22:45 UTC (Octopus Energy publishes between 4pm
    # and 8pm UK time), and six times overnight and through the day. Runs with nothing
    # new exit in seconds. The pages also fetch missing prices live (site/live.js).
    - cron: "4,19,34,49 15-22 * * *"
    - cron: "7 23,0,3,6,9,12 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore: ["site/data/**"]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The build minifies the site's scripts with terser (the only dependency).
      - name: Install build tools
        run: npm ci --no-audit --no-fund

      # Tests guard code changes. Scheduled runs don't change code, so they skip the
      # tests: a test must never stop fresh prices reaching the site.
      - name: Run tests
        if: github.event_name != 'schedule'
        run: npm test

      - name: Fill gaps in price history (for the recent-days tables)
        continue-on-error: true
        run: node scripts/backfill-history.mjs

      - name: Fetch prices
        run: node scripts/fetch-prices.mjs

      - name: Fetch rates for the tariff guide (keeps the last good rates on failure)
        continue-on-error: true
        run: node scripts/fetch-tariffs.mjs

      - name: Build site and region pages
        run: node scripts/build-site.mjs

      - name: SEO audit (stops the deploy if any page fails)
        run: node scripts/seo-audit.mjs

      - name: Save new prices to the repo
        id: commit
        run: |
          git config user.name "plunge-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new prices."
          else
            git commit -m "Update Octopus prices $(date -u +%Y-%m-%dT%H:%MZ)"
            # Someone may have pushed code while this ran: replay our data commit on top.
            git pull --rebase --quiet origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Publish only when something changed, or when run by hand or after a code change.
      - name: Set up Pages
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5

      - name: Upload site
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deploy
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4

      # Alerts: a failed run opens (or updates) a GitHub issue, which GitHub emails to
      # the repo owner. The next successful run closes it.
      - name: Raise an alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Price update failing"
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          BODY="The price update failed at $(date -u +%Y-%m-%dT%H:%MZ). Details: $RUN_URL. Visitors still see prices: the pages fetch missing prices from Octopus Energy directly."
          if [ -n "$NUM" ]; then gh issue comment "$NUM" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY"; fi

      - name: Close the alert once fixed
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --search 'in:title "Price update failing"' --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Fixed: the price update ran successfully at $(date -u +%Y-%m-%dT%H:%MZ)."
          done
